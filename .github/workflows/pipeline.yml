name: Automated News Pipeline

on:
  # Automated background schedule (runs periodically to check against Admin Panel IST time setting)
  schedule:
    - cron: "*/15 * * * *"

  # Allows triggering via GitHub API (Admin Panel, Webhooks) or manual button click in GitHub Actions
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Trigger Source (e.g. admin_panel, scheduled_cron, manual)"
        required: false
        default: "manual"

jobs:
  execute:
    name: Run AI Newsletter Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Pipeline Runner
        run: npm run pipeline:run
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
